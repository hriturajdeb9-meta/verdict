# Render's free tier sleeps after 15 minutes without traffic, and the first visit then
# takes ~50 s. Pinging the health endpoint every few minutes keeps the demo instant
# for judges. One always-on free service fits inside Render's 750 free hours a month.
name: Keep demo awake
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --max-time 90 https://verdict-jpko.onrender.com/api/health
